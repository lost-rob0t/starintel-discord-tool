[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starintel-discord-tool"
version = "1.0.0"
description = "Discord operations client for StarIntel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "discord.py>=2.5,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
starintel-discord = "starintel_discord.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# CI is intentionally correctness-focused. Formatting is kept separate so
# connector-created or generated source is not rejected for line wrapping.
select = ["E4", "E7", "E9", "F", "B", "SIM"]
